[build]
  publish = "."
  functions = "netlify/functions"
  command = "node scripts/update-imdb-ratings.js --allow-stale"

[functions."omdb"]
  included_files = ["data/imdb-ratings.bin.gz"]

[functions."tmdb"]
  included_files = ["data/imdb-ratings.bin.gz"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; \
      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; \
      font-src 'self' https://cdnjs.cloudflare.com data:; \
      img-src 'self' data: blob: https://image.tmdb.org https://upload.wikimedia.org; \
      connect-src 'self' https://image.tmdb.org https://www.youtube-nocookie.com; \
      frame-src https://www.youtube-nocookie.com https://www.youtube.com; \
      worker-src 'self'; \
      manifest-src 'self'; \
      object-src 'none'; \
      base-uri 'self'; \
      frame-ancestors 'self'; \
      form-action 'self';"""
